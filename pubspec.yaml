name: ashkali
description: "أشكالي - Arabic Shapes Learning App for Kids"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  provider: ^6.1.5

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  path_provider: ^2.1.5

  flutter_tts: ^4.2.5

  audioplayers: ^6.5.0

  google_mobile_ads: ^6.0.0

  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.5.4

  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
