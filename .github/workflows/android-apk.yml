name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Ashkali Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Verify project
        run: |
          echo "=== PUBSPEC ==="
          grep -n "build_runner\|hive_generator" pubspec.yaml || true
          echo "=== WORKFLOWS ==="
          find .github/workflows -type f -maxdepth 1 -print || true
          echo "=== PLATFORMS ==="
          ls -la

      - name: Clean
        run: flutter clean

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ashkali-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
